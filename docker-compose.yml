services:
  # Traefik Reverse Proxy (Only starts when running with: docker compose --profile traefik up -d)
  # If Traefik is already running on your VPS, simply run: docker compose up -d
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80/tcp"          # HTTP (TCP only)
      - "443:443/tcp"        # HTTPS (TCP for standard connections)
      - "443:443/udp"        # <-- CRITICAL: HTTP/3 (QUIC) runs over UDP!
    command:
      # Global configuration
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Automatically redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.http3"
      
      # Let's Encrypt / ACME configuration
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@kalobazar.shop}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - traefik-public
    profiles:
      - traefik

  # Backend API & Uploads Server (Hono)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${SERVER_CONTAINER_NAME:-kalobazar_server}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://guessbdofficial_db_user:K5uXITDHJ9oK2Lav@guessbd.fg1dxhx.mongodb.net/kalobazar?retryWrites=true&w=majority}
      - UPLOADS_DIR=/app/uploads
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN:-kalobazar.shop}}
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    labels:
      - "traefik.enable=true"
      # Priority 100: Route /api/* and /uploads/* to the backend API & static asset server
      - "traefik.http.routers.digicom-server.rule=(Host(`${DOMAIN:-kalobazar.shop}`)${DOMAIN_WWW:+ || Host(`www.${DOMAIN:-kalobazar.shop}`)}) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.digicom-server.entrypoints=web,websecure"
      - "traefik.http.routers.digicom-server.tls.certresolver=le"
      - "traefik.http.routers.digicom-server.priority=100"
      - "traefik.http.routers.digicom-server.service=digicom-server"
      - "traefik.http.services.digicom-server.loadbalancer.server.port=5000"
      - "traefik.http.services.digicom-server.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.digicom-server.loadbalancer.healthcheck.interval=15s"
      - "traefik.http.services.digicom-server.loadbalancer.healthcheck.timeout=10s"
    networks:
      - traefik-public
      - internal-net

  # Frontend App (Next.js)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN:-kalobazar.shop}}
        - NEXT_PUBLIC_META_PIXEL_ID=${NEXT_PUBLIC_META_PIXEL_ID:-}
        - INTERNAL_API_URL=http://server:5000
    container_name: ${CLIENT_CONTAINER_NAME:-kalobazar_client}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - INTERNAL_API_URL=http://server:5000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN:-kalobazar.shop}}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # Priority 10: Route all other web traffic to Next.js
      - "traefik.http.routers.digicom-client.rule=Host(`${DOMAIN:-kalobazar.shop}`)${DOMAIN_WWW:+ || Host(`www.${DOMAIN:-kalobazar.shop}`)}"
      - "traefik.http.routers.digicom-client.entrypoints=web,websecure"
      - "traefik.http.routers.digicom-client.tls.certresolver=le"
      - "traefik.http.routers.digicom-client.priority=10"
      - "traefik.http.routers.digicom-client.service=digicom-client"
      - "traefik.http.services.digicom-client.loadbalancer.server.port=3000"
      - "traefik.http.services.digicom-client.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.digicom-client.loadbalancer.healthcheck.interval=15s"
      - "traefik.http.services.digicom-client.loadbalancer.healthcheck.timeout=10s"
    depends_on:
      - server
    networks:
      - traefik-public
      - internal-net

volumes:
  uploads_data:
    driver: local

networks:
  traefik-public:
    external: true
  internal-net:
    driver: bridge
